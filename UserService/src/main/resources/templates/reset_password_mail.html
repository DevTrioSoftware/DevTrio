<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px;">
<div style="max-width: 600px; margin: auto; background-color: white; padding: 20px; border-radius: 10px;">
    <img src="cid:banner-image" alt="Banner" style="width: 100%; border-radius: 10px 10px 0 0;">
    <h2>Hello {{name}},</h2>
    <p>We've received a request to reset your password.</p>
    <p>Your reset code is:</p>
    <div style="font-size: 24px; font-weight: bold; background-color: #eee; padding: 10px; text-align: center; border-radius: 5px;">
        {{code}}
    </div>
    <p>This code will expire in 15 minutes.</p>
    <p>If you didn't request a password reset, you can ignore this email.</p>
    <p>Regards,<br><strong>DevTrio Software Team</strong></p>
</div>
</body>
</html>
